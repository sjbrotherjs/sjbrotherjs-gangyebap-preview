<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff9e8">
  <title>간계밥 · 식사 기록</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <header><strong>간계밥 <span>2.0</span></strong><time id="date"></time><button id="settings" aria-label="설정"><span class="gearIcon" aria-hidden="true"></span></button></header>
  <section class="summary" aria-labelledby="balanceTitle">
    <img class="mascot" src="assets/mascot.webp" alt="웃는 간장계란밥">
    <div class="balancePanel">
      <span class="balanceRays" aria-hidden="true"><i></i><i></i><i></i></span>
      <h1 id="balanceTitle">오늘 남은 칼로리</h1>
      <strong id="balance"><span id="balanceValue">—</span> <span class="balanceUnit">kcal</span></strong>
      <div class="summaryMeta"><span id="summary"></span><span id="activity"></span></div>
    </div>
    <div class="featuredFood" aria-labelledby="recTitle">
      <h2 id="recTitle">추천 음식</h2>
      <div id="cards" aria-live="polite"></div>
      <button id="refreshCard" type="button" aria-label="다른 음식 추천"><span aria-hidden="true">›</span></button>
    </div>
  </section>

  <section class="surface diarySurface" aria-labelledby="logTitle">
    <div class="sectionHead"><h2 id="logTitle">오늘 먹은 음식 <span>· 입력 순서</span></h2><strong id="intake">0 kcal</strong></div>
    <div id="cart" aria-live="polite"></div>
    <button id="history" type="button">지난 기록 <span aria-hidden="true">›</span></button>
  </section>
  <section class="surface" aria-labelledby="quickTitle">
    <h2 id="quickTitle">오늘 무엇을 드셨나요?</h2>
    <div id="quickGroups" class="categoryGrid"></div>
  </section>
  <section class="surface" aria-labelledby="libraryTitle">
    <div class="sectionHead"><h2 id="libraryTitle">내 음식 라이브러리</h2><button id="manual" type="button">＋ 직접 입력</button></div>
    <div id="libraryTabs" class="libraryTabs" aria-label="라이브러리 분류">
      <button data-library="often">자주 먹는</button><button data-library="favorite">즐겨찾기</button><button data-library="recent">최근 음식</button><button data-library="sets">내 세트</button><button data-library="own">직접 등록</button>
    </div>
    <div id="library"></div>
  </section>
  <section class="foodSearch" role="search" aria-label="음식 검색">
    <label class="searchBar"><span class="searchIcon" aria-hidden="true"></span><input id="query" type="search" aria-label="음식명 · 브랜드 · 메뉴 검색" placeholder="음식명 · 브랜드 · 메뉴 검색"></label>
    <div class="sectionHead"><small id="count" aria-live="polite"></small><button id="clearSearch" type="button" hidden>검색 닫기</button></div>
    <div id="matches" class="resultList"></div>
  </section>
  <section class="surface categorySurface" aria-labelledby="categoryTitle">
    <div class="sectionHead categoryHead">
      <h2 id="categoryTitle">브랜드 탐색</h2>
      <button id="brandBrowse" class="brandBrowse" type="button" aria-haspopup="dialog" aria-controls="sheet">전체보기 <span aria-hidden="true">›</span></button>
    </div>
    <div id="categories" class="categoryGrid"></div>
  </section>
</main>
<aside id="calculator" aria-label="식사 계산기" hidden>
  <details id="related" open hidden><summary>함께 먹을 만한 음식</summary><div id="relatedFoods" class="categoryGrid"></div></details>
  <div class="sectionHead"><button id="toggleDraft" type="button" aria-controls="draftRows" aria-expanded="true">식사 계산기</button><small id="draftTotal" aria-live="polite"></small><button id="finishMeal" type="button">계산 완료</button></div>
  <div id="draftRows"></div>
  <button id="saveSet" type="button">＋ 세트 저장</button>
</aside>
<dialog id="sheet" aria-labelledby="dialogTitle">
  <div class="dialogHead"><h2 id="dialogTitle"></h2><button id="close" aria-label="닫기">×</button></div>
  <div id="panel"></div>
</dialog>
<output id="status" role="status"></output>
<script src="db/start.js"></script><script src="db/brands.js"></script><script src="catalog.js"></script><script src="nutrition.js"></script><script src="recommendation.js"></script><script src="library.js"></script><script src="storage.js"></script><script src="meal.js"></script><script src="app.js"></script>
</body>
</html>
